version: "3.8"

services:
  mysql:
    image: mysql:8.0.34
    container_name: momentix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: momentix
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    volumes:
      - momentix-mysql-data:/var/lib/mysql

  redis:
    image: redis:6.2
    container_name: momentix-redis
    ports:
      - "6379:6379"
    volumes:
      - momentix-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  momentix-mysql-data:
  momentix-redis-data:

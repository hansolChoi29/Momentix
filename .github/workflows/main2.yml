name: Deploy to EC2

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew clean bootJar -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/momentix/"

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            APP_DIR="/home/ec2-user/momentix"
            LOG="$APP_DIR/app.log"
            JAR="$(ls -1t "$APP_DIR"/build/libs/*.jar | grep -v plain | head -n 1 || true)"
            [ -z "${JAR:-}" ] && echo "no runnable JAR in $APP_DIR/build/libs" && exit 1
            
            # 이전 버전 종료(경로 기준)
            pkill -f "$APP_DIR/build/libs/.*\.jar" || true
            
            # .env를 읽게 하려면 작업 디렉토리를 APP_DIR로
            cd "$APP_DIR"
            
            # 프로필은 prod로, 나머지 값은 .env에서 읽힘
            nohup java -jar "$JAR" --spring.profiles.active=prod > "$LOG" 2>&1 &

            sleep 4
            pgrep -f "$(basename "$JAR")" >/dev/null || (tail -n 200 "$LOG"; exit 1)
            echo "OK"
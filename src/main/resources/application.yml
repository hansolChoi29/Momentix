spring:
  application:
    name: momentix
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  session:
    timeout: 10m
  task:
    scheduling:
      pool:
        size: 5

jwt:
  access:
    ttl: 30
  refresh:
    ttl: 14
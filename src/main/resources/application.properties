spring.application.name=momentix

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/momentix
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.task.scheduling.pool.size=5
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.user.name=${APP_USER}
spring.security.user.password=${APP_PASSWORD}
spring.security.user.roles=USER

logging.level.org.springframework.security=DEBUG

slack.bot-token=${BOT_TOKEN}

spring.servlet.multipart.enabled=true

#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}

cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secretKey=${AWS_SECRET_ACCESS_KEY}
cloud.aws.s3.bucket=${AWS_BUCKET}
cloud.aws.region.static=${AWS_REGION}
cloud.aws.stack.auto=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

naver.client.id=${NAVER_CLIENT_ID}
naver.client.secret=${NAVER_CLIENT_SECRET}
naver.redirect.uri=${NAVER_REDIRECT_URI}
jwt.access.ttl=30
jwt.refresh.ttl=14

kakao.client.id=${KAKAO_CLIENT_ID}
kakao.client.secret=${KAKAO_CLIENT_SECRET}
kakao.redirect.uri=${KAKAO_REDIRECT_URI}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

elasticsearch.url=${ELASTICSEARCH_URL}
elasticsearch.apikey=${ELASTIC_API_KEY}
search.bootstrap.enabled=true

spring.session.timeout=10m

spring.datasource.hikari.maximum-pool-size=100